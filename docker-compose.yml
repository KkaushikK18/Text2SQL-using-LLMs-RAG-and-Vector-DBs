version: '3.8'

services:
  api:
    build: .
    container_name: text2sql_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: .
    container_name: text2sql_frontend
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - api
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
